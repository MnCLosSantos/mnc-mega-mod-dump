<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Catalog</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="modal-overlay">
        <div class="dashboard-container">
            <div class="dashboard-header">
                <div class="search-container">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search vehicles...">
                    <i class="fas fa-search search-icon"></i>
                </div>
                <div class="header-buttons">
                    <button class="close-btn" onclick="closeUI()"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="dashboard-content">
                <div class="dashboard-sidebar">
                    <div class="sidebar-header">
                        <h3 class="sidebar-title">
                            <i class="fas fa-list"></i>
                            Categories
                        </h3>
                    </div>
                    <div class="category-items" id="category-list"></div>
                </div>
                <div class="dashboard-main">
                    <div class="main-header">
                        <h3 id="current-category">
                            <i class="fas fa-layer-group"></i>
                            All Vehicles
                        </h3>
                        <span class="results-count" id="results-count">0 vehicles available</span>
                    </div>
                    <div class="vehicle-grid" id="vehicle-list"></div>
                </div>
            </div>
        </div>
        <div class="proximity-container" id="proximity-ui">
            <div class="proximity-content">
                <i class="fas fa-car"></i>
                <span id="proximity-title">Vehicle Catalog</span>
                <p>Press [E] to Open</p>
            </div>
        </div>
    </div>
</body>
</html>
