<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNC Item Spawner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Search items...">
                <i class="fas fa-search search-icon"></i>
            </div>
            <div class="header-buttons">
                <button class="cart-header-btn" onclick="openCartViewModal()">
                    <i class="fas fa-shopping-cart"></i> Cart
                </button>
                <button class="close-btn" onclick="closeUI()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <div class="dashboard-content">
            <div class="dashboard-sidebar">
                <div class="sidebar-header">
                    <h3 class="sidebar-title">
                        <i class="fas fa-layer-group"></i>
                        Categories
                    </h3>
                </div>
                <div id="category-list" class="category-items"></div>
            </div>
            <div class="dashboard-main">
                <div class="main-header">
                    <h3 id="current-category"></h3>
                    <span id="results-count">0 items available</span>
                </div>
                <div id="item-list" class="item-grid"></div>
            </div>
        </div>
    </div>
</body>
</html>
