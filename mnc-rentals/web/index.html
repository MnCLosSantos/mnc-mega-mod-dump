<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="modal-overlay">
        <div class="dashboard-container">
            <img class="watermark" id="watermark" src="">
            <div class="dashboard-header">
                <img id="logo" class="header-logo" src="">
                <div class="header-buttons">
                    <button class="close-btn" onclick="closeUI()"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="dashboard-content">
                <div class="dashboard-sidebar">
                    <div class="sidebar-header">
                        <div class="sidebar-title"><i class="fas fa-list"></i> Categories</div>
                    </div>
                    <div class="category-items" id="category-list"></div>
                </div>
                <div class="dashboard-main">
                    <div class="main-header">
                        <h2 id="current-category"><i class="fas fa-layer-group"></i><span>Vehicle Rentals</span></h2>
                        <span class="results-count" id="results-count">0 vehicles available</span>
                    </div>
                    <div class="vehicle-grid" id="vehicle-list"></div>
                </div>
            </div>
        </div>

        <!-- Duration Selection Modal -->
        <div class="duration-modal" id="durationModal">
            <div class="duration-modal-content">
                <div class="duration-modal-header">
                    <h3><i class="fas fa-clock"></i> Select Rental Duration</h3>
                    <button class="duration-close-btn" onclick="closeDurationModal()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="duration-modal-body">
                    <p class="duration-info">Choose how long you'd like to rent this vehicle:</p>
                    <div class="duration-vehicle-info" id="durationVehicleInfo"></div>
                    <div class="duration-options" id="durationOptions"></div>
                    <p class="duration-note">
                        <i class="fas fa-info-circle"></i> 
                        Return the vehicle to this location within the rental period for a 10% refund.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
