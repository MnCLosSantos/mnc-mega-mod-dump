<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MNC Forklift Fix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="panels">
        <div id="panel-forklift" class="panel hidden">
            <div class="panel__header">
                <div class="panel__icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="14" width="20" height="4" rx="1"/>
                        <path d="M2 14V9l4-5h10l4 5v5"/>
                        <path d="M6 14V9"/>
                        <circle cx="7" cy="19" r="1.5"/>
                        <circle cx="17" cy="19" r="1.5"/>
                    </svg>
                </div>
                <span class="panel__title">Forklift Controls</span>
				<div class="panel__mode-badge" id="mode-badge"></div>
            </div>
            <div class="panel__body" id="forklift-rows"></div>
        </div>

        <div id="panel-stack" class="panel hidden">
            <div class="panel__header">
                <div class="panel__icon panel__icon--amber">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="14" width="18" height="4" rx="1"/>
                        <rect x="3" y="8" width="18" height="4" rx="1"/>
                        <rect x="3" y="2" width="18" height="4" rx="1"/>
                    </svg>
                </div>
                <span class="panel__title">Attachment Controls</span>
            </div>
            <div class="panel__body" id="stack-rows"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
